name: reel

# Build one reel, publish it, then the next, then the next - and stop dead at the
# first failure. No half-finished state, no retrying into a broken condition.
#
# Runs every evening inside the 19:00-20:00 IST posting window.

on:
  schedule:
    # 13:37 UTC = 19:07 IST. Inside the window, early enough that a single reel
    # finishes well before 20:00. :37 rather than :00/:30 because GitHub's
    # scheduler is worst at the top of the hour and can drop runs under load.
    - cron: "37 13 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "how many reels; 0 = keep going until something fails"
        default: "1"
      mode:
        description: "publish, or rehearse without uploading"
        type: choice
        options:
          - publish
          - dry-run
        default: publish

permissions:
  contents: write              # commit the ledger after each publish

concurrency:
  group: reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      # actions/checkout pins the commit that TRIGGERED this run. Read the ledger
      # from origin so a reel published since then is not built again.
      - name: Refresh the published ledger from main
        run: |
          git fetch --depth=1 origin main
          git show origin/main:pipeline/state/published.json > state/published.json
          python3 -c "import json;print('ledger entries:', len(json.load(open('state/published.json'))['published']))"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null

      - name: Install Python dependencies
        run: pip install --quiet -r requirements.txt

      - name: Verify dependencies and imports
        env:
          PYTHONPATH: src
        run: |
          python scripts/check_deps.py
          python -c "
          import reelforge.cli, reelforge.pipeline, reelforge.captions_png
          import reelforge.visuals, reelforge.render, reelforge.voice
          import reelforge.llm, reelforge.meta, reelforge.publish
          print('imports OK')
          "

      - name: Cache piper voice
        uses: actions/cache@v4
        with:
          path: pipeline/assets/piper
          key: piper-en_US-ryan-high-v1

      # 13 images per reel is the expensive part (~600 neurons) and a rebuild of
      # the same script produces identical seeds, so a warm cache makes retries
      # free. The free allocation is 10,000 neurons/day.
      - name: Cache generated illustrations
        uses: actions/cache@v4
        with:
          path: pipeline/assets/cache/ai
          key: ai-${{ hashFiles('pipeline/config/topics.yaml') }}
          restore-keys: |
            ai-

      - name: Check required secrets are present
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=""
          if [ -z "$YT_CLIENT_SECRET_JSON" ]; then missing="$missing YT_CLIENT_SECRET_JSON"; fi
          if [ -z "$YT_TOKEN_JSON" ];        then missing="$missing YT_TOKEN_JSON"; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then missing="$missing CLOUDFLARE_ACCOUNT_ID"; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ];  then missing="$missing CLOUDFLARE_API_TOKEN"; fi
          if [ -n "$missing" ]; then
            echo "::error title=Missing repository secrets::Not set:$missing"
            echo "Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi
          echo "required secrets present"

      - name: Materialise credentials
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p secrets
          printf '%s' "$YT_CLIENT_SECRET_JSON" > secrets/yt_client_secret.json
          printf '%s' "$YT_TOKEN_JSON" > secrets/yt_token.json
          {
            echo "IG_LOGIN_TYPE=facebook"
            echo "IG_USER_ID=$IG_USER_ID"
            echo "IG_ACCESS_TOKEN=$IG_ACCESS_TOKEN"
            echo "FB_PAGE_ID=$FB_PAGE_ID"
            echo "FB_PAGE_TOKEN=$FB_PAGE_TOKEN"
            echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID"
            echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN"
            echo "IG_HOST=gh_release"
            echo "GH_RELEASE_REPO=${{ github.repository }}"
          } > .env
          chmod 600 .env secrets/*

      - name: Build and publish, one at a time
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_BACKEND: cloudflare
          PYTHONUNBUFFERED: "1"
        run: |
          PYTHONPATH=src python -u scripts/cloud_run.py \
            --count "${{ github.event.inputs.count || '1' }}" \
            ${{ github.event.inputs.mode == 'dry-run' && '--dry-run' || '' }}

      # Runs even on failure: a reel published before the error must still be
      # recorded, or the next run would build it again.
      - name: Record what was published
        if: always()
        run: |
          git config user.name  "reelforge-bot"
          git config user.email "reelforge-bot@users.noreply.github.com"
          git add state/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "ledger unchanged"
            exit 0
          fi
          git commit -m "chore: record published reel [skip ci]"

          # actions/checkout leaves a DETACHED HEAD for schedule and
          # workflow_dispatch runs, where a bare `git push` fails with
          # "push the history leading to the current (detached HEAD)". That is
          # exactly how a reel got uploaded twice on 16 Nov: the upload worked,
          # the ledger never landed, and the next run did not know.
          # Always push an explicit refspec.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main >/dev/null 2>&1 || true
            if git push origin HEAD:main; then
              echo "ledger pushed (attempt $attempt)"
              exit 0
            fi
            sleep 5
          done
          echo "::error title=Ledger NOT recorded::push failed after 3 attempts. Add the topic_id to state/published.json by hand."
          exit 1

      - name: Upload the renders for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reels
          path: |
            pipeline/out/*.mp4
            pipeline/out/*.json
          if-no-files-found: ignore
          retention-days: 14
