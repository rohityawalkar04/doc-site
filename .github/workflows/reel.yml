name: reel-local-only

# Image generation now runs on the owner's Apple Silicon Mac using MLX.
# GitHub-hosted Linux runners cannot use that local GPU, so this workflow is
# intentionally manual and informational; it must not publish or call image APIs.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-only:
    runs-on: ubuntu-latest
    steps:
      - name: Explain local generation requirement
        run: |
          echo "::notice title=Local generation required::Run the Gita & Grit reel pipeline on your M4 Mac."
          echo "This workflow intentionally does not generate images or publish videos."
          echo "On the Mac: cd pipeline && ./scripts/setup.sh"
          echo "Then: source .venv/bin/activate && pip install -r requirements-ai.txt"
          echo "Then: reelforge doctor && reelforge render --count 1"
