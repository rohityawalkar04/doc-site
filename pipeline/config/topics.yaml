  - n: That return is the entire skill, and it is trainable.
    v: a door closing softly into place
  - n: You will still be interrupted. Interruptions are not the enemy.
    v: rain against a single window pane
  - n: Abandonment is. Never leave a thing half understood.
    v: an unfinished wooden joint
  - n: So choose one task and finish it before opening anything.
    v: a hand closing a single book
  - n: Focus is not a mood. It is a shorter list of open loops.
    v: one lantern in a dark room
- id: deadline-compresses
