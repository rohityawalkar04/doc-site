  title: Rest is not the reward for finishing
  angle: Treating rest as a reward makes recovery a debt you can never pay. It is part of the work, planned like the start.
  hashtags:
  - '#shorts'
  - '#motivation'
  - '#burnout'
  - '#recovery'
  - '#sustainability'
  beats:
  - n: You are treating rest as the reward for finishing.
    v: a bed with a folded blanket
  - n: That makes recovery a debt you can never pay.
    v: a stack of unopened envelopes
  - n: So you work until you are useless, then call it a break.
    v: a person sitting slumped at a desk
  - n: And you return to the same work with less of yourself.
    v: a candle burned almost to the wax
  - n: Recovery is not the opposite of work. It is part of it.
    v: a field lying fallow in low light
  - n: Muscles, attention, judgement. All of it rebuilds when you stop.
