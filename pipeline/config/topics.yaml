  - n: If you cannot undo it, slow down and gather one more fact.
    v: a stone door with heavy hinges
  - n: Most people invert this and spend hours on lunch.
    v: a plate of plain food on a table
  - n: Speed on the cheap ones buys patience for the expensive ones.
    v: a smooth stone next to a rough one
  - n: Choose a default for anything you do not care about.
    v: a single arrow painted on a wall
  - n: Then stop relitigating it every single day.
    v: a closed drawer with a small handle
  - n: Make one reversible decision today in under a minute.
    v: a hand pressing a small button
  - n: Attention is what you are actually spending. Budget it.
    v: a lantern set down on a table
- id: attention-residue
  kind: motivation
  title: You are bad at not switching, not at focusing
  angle: Every context swap leaves part of your attention stuck behind. The enemy is not interruption, it is abandonment.
  hashtags:
  - '#shorts'
  - '#motivation'
  - '#focus'
  - '#attention'
  - '#deepwork'
  beats:
  - n: You are not bad at focusing. You are bad at not switching.
    v: a desk with three open books
  - n: Every swap leaves a little of your attention stuck behind.
    v: a spilled cup of dark tea
  - n: So you finish a day of work and cannot say what you did.
    v: a chair pushed back from a desk at night
  - n: The problem is not the interruption. It is the residue.
    v: dust settling on a windowsill
  - n: One thing at a time is not discipline. It is accounting.
    v: a single line of coins on a table
  - n: Close the tabs. Not most of them. All of them but one.
    v: a laptop with a plain empty screen
  - n: Write the next action on paper so you do not hold it.
    v: a small note under a paperweight
  - n: When something arrives, write it down and return.
