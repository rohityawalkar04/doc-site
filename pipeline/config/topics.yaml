# Topic queue for Gita & Grit - motivation lane.
#
# Every beat entry is {n: narration, v: visual query}. The visual query drives the
# AI illustration, so each scene gets its own subject instead of repeating one.
#
# Mythology is parked in config/topics-mythology.yaml; restore it with
#   cp config/topics-mythology.yaml config/topics.yaml
topics:
- id: not-lazy-one-feeling
  kind: motivation
  title: You are not lazy. You are avoiding one feeling.
  angle: Procrastination is emotional avoidance, not a character defect. Dread is a prediction about the size of the task in your head, and you shrink it by shrinking the first action.
  hashtags:
  - '#shorts'
  - '#motivation'
  - '#procrastination'
  - '#discipline'
  - '#mindset'
  beats:
  - n: You are not lazy. You are avoiding one specific feeling.
    v: a person sitting on the edge of a bed in dim light
  - n: The task is not hard. The first half minute of it is.
    v: a closed laptop with two hands resting beside it
  - n: That feeling is dread, and dread is a prediction, not a fact.
    v: a dark corridor with light at the far end
  - n: You cannot argue with dread while you are standing still.
    v: a figure standing motionless in a doorway
  - n: So do not argue. Shrink the action until the dread has nothing to grip.
    v: an enormous boulder beside a small stone
  - n: Open the document. Do not write. Just open it.
    v: a hand lifting the lid of a laptop
  - n: Put on the shoes. Do not run. Just put them on.
    v: running shoes placed neatly beside a door
  - n: Dread is almost always about the size of the picture in your head.
    v: an enormous shadow cast by a tiny object
  - n: Make the picture small and the feeling shrinks with it.
    v: a long shadow shrinking as a lamp is lowered
  - n: This is not a trick. It is the only thing that has ever worked.
    v: a plain key turning in a simple lock
  - n: Lazy people do not want things. You want this one thing.
    v: a hand reaching toward a warm lamp
  - n: So stop diagnosing yourself as lazy and start naming the feeling.
    v: a face lit from one side, thinking
  - n: Then take the smallest step that makes the feeling smaller.
    v: a single footprint in wet sand at dawn
- id: standards-block-first-draft
  kind: motivation
  title: Your standards are why you have not started
  angle: High standards applied to the first attempt produce paralysis. The people you admire did not lower the bar, they separated it from the first draft.
  hashtags:
  - '#shorts'
  - '#motivation'
  - '#perfectionism'
  - '#discipline'
  - '#creativity'
  beats:
  - n: Your standards are not why you are good. They are why you have not started.
    v: a tall unfinished sculpture in a dusty studio
  - n: The version in your head is finished. The version in your hands is not.
    v: two hands holding a rough clay shape
  - n: So you do not start, because starting means comparing them.
    v: two mirrors facing each other
  - n: That comparison is unfair and you make it every single time.
    v: a small scale weighing a stone against a feather
  - n: Every first attempt is a bad drawing of a good idea.
    v: a rough pencil sketch on crumpled paper
  - n: Everyone you admire has made far more bad attempts than you have.
    v: a floor covered in crumpled paper balls
  - n: They did not lower the standard. They separated it from the first draft.
    v: two doors, one painted bright and one unpainted
  - n: High standard for the finished thing. Almost none for the first.
    v: a polished stone beside a rough one
  - n: Write the ugly version. Say the sentence badly. Draw the wrong line.
    v: a pencil crossing out a line
  - n: Then apply the standard you were protecting all along.
    v: a chisel held against smooth marble
  - n: You were never protecting quality. You were hiding from the gap.
    v: a figure turning away from a bright doorway
  - n: That gap closes by working, not by waiting for the picture in your head.
    v: a hand sanding a rough surface smooth
  - n: Start badly, on purpose, today.
    v: a fresh sheet of paper under a warm lamp
- id: announcing-the-plan
  kind: motivation
  title: Announcing the plan is the reward
  angle: Describing a plan pays you a little of the feeling of having finished it, which is why the work afterwards feels flat. Sequence matters more than secrecy.
  hashtags:
  - '#shorts'
  - '#motivation'
  - '#discipline'
  - '#focus'
  - '#mindset'
  beats:
  - n: Telling people your plan feels like progress. It is not.
    v: a person gesturing excitedly at a small group
  - n: It is a payment. You get a little of the reward before doing the work.
    v: a hand receiving a single gold coin
  - n: That is why the plan feels so good to describe.
    v: a speech bubble glowing above a figure
  - n: And that is why the work feels flat straight afterwards.
    v: a cold cup of tea on a bare table
  - n: You have already been congratulated. By yourself and by them.
    v: empty chairs around a warm lamp
  - n: This is not about secrecy. It is about sequencing.
    v: a staircase seen from the bottom
  - n: Say what you did. Not what you are going to do.
    v: a finished wooden chair on a workbench
  - n: Let the finished thing be the announcement.
    v: a lantern lit in an open doorway
  - n: If you need accountability, give someone a date and a deliverable.
    v: a calendar with a single marked square
  - n: Not a vision. A date.
    v: a clock face on a plain wall
  - n: They should be able to check whether it happened.
    v: an open ledger with a single line written
  - n: Everything else is rehearsal for the feeling of finishing.
    v: an empty stage lit by one lamp
  - n: Do the work first. Then let them be impressed.
    v: a figure standing beside a completed wooden table
- id: boredom-is-the-tax
  kind: motivation
  title: You do not quit because it is hard
  angle: People mistake the flat plateau of repetition for evidence they chose wrong. Every skill has a stretch where nothing new happens, and changing direction just moves the boredom.
  hashtags:
  - '#shorts'
  - '#motivation'
  - '#discipline'
  - '#mastery'
  - '#consistency'
  beats:
  - n: You do not quit because it is hard. You quit because it got boring.
    v: a figure sitting alone at a long desk
  - n: Hard feels like progress. Boring feels like a mistake.
    v: a steep hill beside a flat empty road
  - n: So you assume you picked the wrong thing.
    v: a figure turning away from a potter's wheel
  - n: You probably did not. You reached the part without novelty.
    v: an identical row of clay pots drying
  - n: Every skill has a stretch where nothing new happens.
    v: a long straight road to the horizon
  - n: The repetitions look identical. Nothing announces improvement.
    v: a stack of identical flat stones
  - n: This is exactly where most people change direction.
    v: a fork in a path, one side overgrown
  - n: And then they meet the same boredom somewhere else.
    v: the same flat road under a different sky
  - n: Boredom is not a signal to leave. It is the price of getting good.
    v: a toll gate on a quiet road
  - n: The interesting part comes after the boring part, not instead of it.
    v: a sunrise beyond a long dark tunnel
  - n: So the question is not whether you enjoy it today.
    v: a single candle burning low
  - n: It is whether you will still be here when it stops being fun.
    v: a figure still seated at the same desk at night
  - n: Stay through the flat part. That is the whole skill.
    v: a hand smoothing clay into a finished bowl
- id: consuming-is-not-doing
  kind: motivation
  title: Watching advice is not discipline
  angle: Learning feels like a substitute for doing because it is easier and gives the same glow. You already know the next step; the gap is comfort, not information.
  hashtags:
  - '#shorts'
  - '#motivation'
  - '#discipline'
  - '#action'
  - '#focus'
  beats:
  - n: Watching advice about discipline is not discipline.
    v: a phone glowing in a dark room
  - n: It feels identical. Same subject, same intention, same glow afterwards.
    v: a warm screen lighting a quiet face
  - n: But nothing moved in your actual life.
    v: an unmade bed in grey morning light
  - n: You now know more and have done less.
    v: a tall stack of unopened books
  - n: That gap is comfortable, which is exactly why you stay in it.
    v: a soft armchair facing away from a desk
  - n: Learning feels like a substitute for doing, because it is easier.
    v: a wide staircase beside a narrow one
  - n: The next video will not contain the missing piece.
    v: an empty box with its lid open
  - n: You already know the next step. You have known for a while.
    v: a single door already slightly open
  - n: So close this and do the one thing you thought about while reading.
    v: a hand setting a phone face down
  - n: It will take less time than the next video does.
    v: a short path beside a long winding road
  - n: Come back when you have done it. Not before.
    v: a closed notebook resting on a table
  - n: Knowledge you do not use becomes heavier, not lighter.
    v: a figure carrying a heavy sack uphill
  - n: Stop collecting. Start paying for it with action.
    v: an open empty hand held out in daylight
- id: identity-not-motivation
  kind: motivation
  title: You do not need more motivation
  angle: Motivation is a mood that arrives late. Identity is a decision made earlier, when it was cheap, so the hard moment is no longer a choice.
  hashtags:
  - '#shorts'
  - '#motivation'
  - '#identity'
  - '#discipline'
  - '#habits'
  beats:
  - n: You do not need more motivation. You need a smaller identity.
    v: a single lit match on a dark table
  - n: Motivation is a mood. It arrives late and leaves early.
    v: an empty chair beside a cold cup of tea
  - n: Identity is a decision about what kind of person you are.
    v: a plain mirror on a bare wall
  - n: So stop asking how to feel driven and start asking who does this.
    v: a worn pair of shoes by a door
  - n: The person who runs does not negotiate at six in the morning.
    v: a dark kitchen window before sunrise
  - n: They are not stronger. They decided earlier, when it was cheap.
    v: a clock face on a plain wall
  - n: Decide once, in daylight, and let the decision do the work.
    v: a single line drawn on paper
  - n: Then the hard moment is not a choice. It is a habit already made.
    v: a well worn wooden stair
  - n: You will still feel unmotivated. That stops mattering.
    v: a person walking through grey rain
  - n: Feelings are weather. Identity is the house you built.
    v: a small house lit against a storm
  - n: 'So pick one thing and say: this is what I do now.'
    v: a hand placing a stone on a wall
  - n: Do it badly this week. Identity does not require applause.
    v: a rough brick in an unfinished wall
  - n: Act like them for a month. Then notice it stopped being acting.
    v: a person standing taller in warm light
- id: environment-over-willpower
  kind: motivation
  title: You are losing to your room, not your weakness
  angle: Willpower is expensive and finite. Every decision you remove from the environment is a decision you never have to win again.
  hashtags:
  - '#shorts'
  - '#motivation'
  - '#habits'
  - '#willpower'
  - '#discipline'
  beats:
  - n: You are not losing to weakness. You are losing to your room.
    v: a cluttered desk in dim light
  - n: Willpower is the most expensive thing you own and it runs out.
    v: a candle burning low
  - n: So stop spending it on decisions you could have removed.
    v: a hand pushing a heavy door
  - n: Put the guitar where you sit, not where you store things.
    v: a guitar leaning against a chair
  - n: Put the phone in another room while you work, not on silent.
    v: a phone face down on a distant shelf
  - n: Make the good thing one step closer and the bad thing further.
    v: two doors one ajar and one shut
  - n: This is not discipline. It is carpentry.
    v: a hammer and nails on a workbench
  - n: You are building a room that argues on your behalf.
    v: a small tidy room with morning light
  - n: Every friction you remove is a decision you never make again.
    v: a smooth stone path
  - n: And every friction you leave is a tax you pay daily.
    v: a narrow doorway with a low beam
  - n: So choose one habit and change the room, not your resolve.
    v: a chair moved closer to a window
  - n: Move one object tonight. That is the whole instruction.
    v: a hand moving a small wooden stool
  - n: Then let the room carry you on the days you cannot.
    v: a lit lamp in a quiet room at dusk
- id: finish-not-start
  kind: motivation
  title: You are short of finished things, not ideas
  angle: Starting is cheap and exciting. Finishing is quiet and expensive, which is why the pile grows and quietly costs attention.
  hashtags:
  - '#shorts'
  - '#motivation'
  - '#focus'
  - '#discipline'
  - '#followthrough'
  beats:
  - n: You are not short of ideas. You are short of finished things.
    v: a shelf of half built wooden shapes
  - n: Starting is exciting and cheap. Finishing is quiet and expensive.
    v: a workbench with tools set down
  - n: So the pile grows, and each item quietly costs you attention.
    v: a stack of unfinished notebooks
  - n: An unfinished thing is not potential. It is a debt.
    v: a half built chair in a dusty room
  - n: Choose the ugly one. Finish the thing you are least proud of.
    v: a rough wooden box unsanded
  - n: Pick the smallest unfinished item. Not the most impressive.
    v: a tiny wooden peg beside a large beam
  - n: Give it one session with a defined ending you can point at.
    v: a single line drawn to the page edge
  - n: Then put it on the shelf where you can see it.
    v: a finished bowl on a bright shelf
  - n: Finishing is a muscle and it is trained with small weights.
    v: a small hand tool resting on wood
  - n: You do not need new ideas. You need the end of an old one.
    v: a road ending at a closed gate
  - n: Each finished thing returns attention you forgot you had.
    v: a cleared desk in morning light
  - n: So finish one thing before you begin anything else.
    v: a hand closing a notebook
  - n: The pile shrinks. That feeling is competence, not luck.
    v: an empty shelf with dust marks
- id: say-no-shrink-list
  kind: motivation
  title: You need a shorter list, not a better one
  angle: Most yeses are made quickly to avoid an awkward moment. The moment is cheap; the commitment is not.
  hashtags:
  - '#shorts'
  - '#motivation'
  - '#focus'
  - '#boundaries'
  - '#discipline'
  beats:
  - n: You do not need a better to do list. You need a shorter one.
    v: a long paper list with many lines
  - n: Every yes is a promise about your future time.
    v: a hand stamping a wax seal
  - n: And most yeses are made quickly, to avoid an awkward moment.
    v: a small closed door in a hallway
  - n: That moment is cheap. The commitment is not.
    v: a heavy iron key on a table
  - n: So count what fits instead of what you could manage.
    v: a small wooden box with the lid open
  - n: If it does not fit, the honest answer today is no.
    v: a gate closed with a rope
  - n: No is not a rejection of the person. It defends the work.
    v: a shield of plain wood
  - n: You will disappoint someone. Choose to disappoint them early.
    v: a person standing calmly at a door
  - n: Silence is not kindness. It is a delayed no with interest.
    v: an unopened envelope on a table
  - n: So keep two things. Do them properly. Let the rest go.
    v: two smooth stones held in one hand
  - n: Saying no today buys attention for tomorrow.
    v: a cleared workspace in soft light
  - n: Pick one thing to stop this week. Say it out loud.
    v: a hand crossing a line off paper
  - n: Subtraction looks like loss and feels like relief.
    v: an empty room with a wide window
- id: comparison-highlight-reel
  kind: motivation
  title: You are comparing your Tuesday to their highlights
  angle: Comparison is not motivation, it is usually justification. You are the only person whose context you can actually see.
  hashtags:
  - '#shorts'
  - '#motivation'
  - '#comparison'
  - '#focus'
  - '#mindset'
  beats:
  - n: You are comparing your ordinary Tuesday to someone's highlights.
    v: a bright framed image beside a bare wall
  - n: They chose that frame. You did not see the other nine hundred.
    v: a stack of discarded photographs
  - n: So you measure your whole life against a selected minute.
    v: a small measuring tape across a room
  - n: That is not envy. It is a bad experiment.
    v: a set of scales with unequal weights
  - n: You are the only person whose context you can actually see.
    v: a window showing only one landscape
  - n: So compete with last month, not with a stranger's post.
    v: two footprints side by side in sand
  - n: Your comparison is not motivation. It is usually justification.
    v: a hand pointing at a distant hill
  - n: Justification to stop, or to start something you do not want.
    v: an open gate leading away
  - n: Close the app and look at what you actually built this year.
    v: worn tools on a used workbench
  - n: That is the only scoreboard with real numbers on it.
    v: a handwritten ledger on a table
  - n: You are behind no one. You are on a different clock.
    v: two clocks showing different hours
  - n: So write down what you finished, not what you envy.
    v: a pencil writing on a plain page
  - n: The feed is not a mirror. Stop using it as one.
    v: a mirror turned to face a wall
- id: cheap-decisions-fast
  kind: motivation
  title: You are tired from small decisions
  angle: Almost every choice you make today is reversible and cheap, yet each gets the attention of a real risk.
  hashtags:
  - '#shorts'
  - '#motivation'
  - '#decisions'
  - '#focus'
  - '#discipline'
  beats:
  - n: You are exhausted from deciding small things, not doing big ones.
    v: a table covered in small objects
  - n: Almost every choice you make today is reversible and cheap.
    v: a light wooden door swinging open
  - n: Yet you give each one the same attention as a real risk.
    v: a single coin balanced on its edge
  - n: That is how an afternoon disappears without anything happening.
    v: an empty chair with a clock behind it
  - n: So sort your decisions by what happens if you are wrong.
    v: two boxes one open and one sealed
  - n: If you can undo it, decide quickly and move.
