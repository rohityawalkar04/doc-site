  title: A task takes as long as you give it
  angle: Without an edge the work expands to fill the silence. A short clock finished beats a long clock perfecting.
  hashtags:
  - '#shorts'
  - '#motivation'
  - '#deadlines'
  - '#focus'
  - '#discipline'
  beats:
  - n: A task will take as long as the time you give it.
    v: an empty hourglass on a desk
  - n: So a week becomes the work of an afternoon, spread thin.
    v: a thin layer of sand on a wide board
  - n: This is not laziness. It is how attention behaves near edges.
    v: a stone at the edge of a cliff
  - n: Without an edge, the work expands to fill the silence.
    v: a candle flame in an empty room
  - n: So give the thing a real ending, written down and visible.
    v: a date circled on a wall calendar
  - n: Not a deadline for the project. One for the next hour.
    v: a small clock beside a single page
  - n: Choose what must be true by the end of it.
    v: a line drawn across paper
  - n: Then let the smaller clever ideas wait.
    v: a rough sketch pushed aside
  - n: Finishing on a short clock beats perfecting on a long one.
    v: a finished plain bowl
  - n: You can always improve a thing that exists.
    v: a rough sculpture catching light
  - n: So shorten the horizon deliberately, not anxiously.
    v: a short path beside a long road
  - n: Set a timer for the next thing you are avoiding.
    v: a hand turning a small dial
  - n: Constraint is not pressure. It is permission to stop.
    v: a door closing gently at dusk
- id: recovery-is-work
