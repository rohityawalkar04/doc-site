    - "a heavy stone at the top of a hill"
    - "a window with rain running down it"
    - "a stack of papers leaning sideways"
    - "a door handle wrapped in cloth"
    - "a figure carrying a wide box alone"
    - "a bridge with one plank missing"
    - "a clock with its hands near midnight"
  step:
    - "a hand opening a small notebook"
    - "a hand setting a cup down on a desk"
    - "a pencil drawing a single straight line"
    - "a shoe placed at the edge of a path"
    - "a small lamp switched on in a dark room"
    - "a hand turning a page of a book"
    - "a short ladder leaning against a wall"
    - "a single key laid on a table"
    - "a hand placing one block on top of another"
    - "a footbridge over a narrow stream"
    - "a hand writing a short note"
    - "a kitchen timer on a plain counter"
    - "a hand closing a laptop slowly"
    - "a stamped envelope on a table"
    - "a person standing up from a chair"
