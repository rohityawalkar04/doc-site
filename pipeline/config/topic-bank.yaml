# Runtime topic bank: what the channel publishes when the hand-written queue in
# config/topics.yaml runs out.
#
# `reelforge.topics` composes one topic per night from this file: a theme gives
# the subject and the nine steps, and the title, hook, tension, payoff and call
# to action rotate with the UTC date. Two rules keep it honest:
#   * every sentence here was written by a person - nothing is generated text;
#   * it goes through the same gates as a hand-written beat sheet (llm._problems:
#     no unverifiable numbers, no banned filler, 8-14 words per scene).
#
# Validate after every edit:
#   PYTHONPATH=src .venv/bin/python -m reelforge.topics --check
# See what it would publish tonight:
#   PYTHONPATH=src .venv/bin/python -m reelforge.topics --next
#
# Numbers must be spelled out. `llm.STAT` blocks any digit followed by a time
# unit ("2 minutes"), and a blocked sentence fails the whole composition.
#
# Each theme needs: id, angle, five titles, two hooks, two tensions, nine steps,
# two payoffs, two ctas. Nine steps + four = the 13 scenes script.min_scenes asks
# for. A theme is used when the rotation lands on it, so more themes means less
# repetition.

hashtags:
  - "#shorts"
  - "#discipline"
  - "#motivation"
  - "#mindset"
  - "#selfimprovement"
  - "#habits"
  - "#focus"

# Visual queries are shared across themes - a reel's images are already unique to
# that reel (the cache is keyed by reel id), so variety here is about the shot,
# not about avoiding a collision.
