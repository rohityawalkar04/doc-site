# Composed at runtime by reelforge.topics. Machine-owned: append-only, and
# committed with the ledger so the channel stays auditable. Edit by hand if a
# composed reel was bad, but do not reformat - the writer rewrites this file.
topics:
- id: asking-is-the-fastest-edit-you-have
  title: Asking is the fastest edit you have
  angle: A guess is not free, it is a loan against your own time. The awkward moment of asking is short,
    and the wrong assumption it avoids can last a month.
  hashtags:
  - '#communication'
  - '#work'
  - '#confidence'
  - '#mindset'
  - '#discipline'
  beats:
  - n: The question is small, and the cost of not asking is not
    v: a packed suitcase left beside a door
  - n: The awkwardness lasts a moment and the wrong guess lasts a month
    v: a bridge with one plank missing
  - n: Write the question as one sentence with the decision attached
    v: a hand opening a small notebook
  - n: Name the two options you are choosing between out loud
    v: a hand setting a cup down on a desk
  - n: Send it early in the day, when people are still generous
    v: a pencil drawing a single straight line
  - n: Say what you already tried, so the answer is cheap to give
    v: a shoe placed at the edge of a path
  - n: Ask the person with the least to gain from flattering you
    v: a small lamp switched on in a dark room
  - n: Set a time after which you stop waiting and choose
    v: a hand turning a page of a book
  - n: Write down the answer before you act, while it is fresh
    v: a short ladder leaning against a wall
  - n: Thank them in one line and tell them what you did
    v: a single key laid on a table
  - n: Keep a list of the questions you were afraid to ask
    v: a hand placing one block on top of another
  - n: Asking gets faster each time, and the shame gets smaller
    v: a single coin resting on an open palm
  - n: Send the question you have been drafting for a week
    v: a hand reaching for a door handle
  theme: asking
- id: you-are-waiting-to-feel-ready
  title: You are waiting to feel ready
  angle: Readiness is a result of motion, not a prerequisite for it. The feeling is real, it just arrives
    second, and waiting for it first is the whole delay.
  hashtags:
  - '#procrastination'
  - '#starting'
  - '#discipline'
  - '#mindset'
  - '#motivation'
  beats:
  - n: You are not waiting for time, you are waiting for a feeling
    v: a calendar with one empty square
  - n: Rehearsal feels like progress, and it makes the first step heavier
    v: a clock with its hands near midnight
  - n: Name the smallest version of the thing you can finish tonight
    v: a hand setting a cup down on a desk
  - n: Start it badly, on purpose, with no plan to fix it
    v: a pencil drawing a single straight line
  - n: Set a timer for two minutes and stop when it rings
    v: a shoe placed at the edge of a path
  - n: Do the ugliest part first, while nobody is watching
    v: a small lamp switched on in a dark room
  - n: Write the next physical action, not the goal
    v: a hand turning a page of a book
  - n: Leave the work open when you stop, so restarting stays cheap
    v: a short ladder leaning against a wall
  - n: Repeat it tomorrow at the same hour, whatever the mood says
    v: a single key laid on a table
  - n: Cut the warm-up ritual down to one thing you cannot skip
    v: a hand placing one block on top of another
  - n: Tell one person you started, and let them ask about it
    v: a footbridge over a narrow stream
  - n: The feeling you wanted was on the other side of the first attempt
    v: a path opening into a wide field
  - n: Start badly tonight, and let tomorrow be the good one
    v: a pen held above a blank page
  theme: readiness
- id: nobody-is-coming-to-give-you-permission
  title: Nobody is coming to give you permission
  angle: Nobody is coming to appoint you. The qualification people wait for is usually issued by the work
    itself, after the work, and the wait is the only thing that separates the two.
  hashtags:
  - '#confidence'
  - '#starting'
  - '#career'
  - '#mindset'
  - '#discipline'
  beats:
  - n: Somebody qualified could tell you to start, and they have not
    v: a figure seen from behind, looking out
  - n: The gate is not the missing title, it is the waiting
    v: a knot in a length of plain rope
  - n: Write down what you would do if a senior person told you to
    v: a pencil drawing a single straight line
  - n: Build the first version without announcing what it is
    v: a shoe placed at the edge of a path
  - n: Answer the question you keep asking other people
    v: a small lamp switched on in a dark room
  - n: Put one piece of the work where a stranger can find it
    v: a hand turning a page of a book
  - n: Replace whether you may with what you will try
    v: a short ladder leaning against a wall
  - n: Find someone doing it badly and note what they got away with
    v: a single key laid on a table
  - n: Give yourself the deadline nobody else is going to set
    v: a hand placing one block on top of another
  - n: Ask for the job instead of the blessing
    v: a footbridge over a narrow stream
  - n: Repeat until being unchosen stops changing your next hour
    v: a hand writing a short note
  - n: Permission is something you backdate, not something you receive
    v: a lit lantern on a windowsill
  - n: Decide who you are waiting for, then write their answer yourself
    v: a shoe stepping onto the first stair
  theme: permission
