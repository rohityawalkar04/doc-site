# One file = one channel. Everything the pipeline needs to make a reel.

name: Gita & Grit

# ---- what the channel is about -------------------------------------------------
lens: "motivation and discipline, argued rather than preached"
audience: "people who consume self-improvement and still do not start; 20-40"
tone: "direct, specific, unsentimental. Name the mechanism, never the vibe. No hype."
language: en

# ---- script ---------------------------------------------------------------------
llm:
  provider: ollama
  # Local Ollama chain: primary first, then a smaller model for 16 GB machines.
  models:
    - qwen2.5:7b-instruct
    - gemma3:4b
  model: qwen2.5:7b-instruct
  temperature: 0.8
  timeout: 300

script:
  # Instagram/YouTube ask for 30-60s. ~3 words/second at this voice's pace, so
  # 10-12 scenes of 8-14 words lands at 28-40s. Prefer more scenes over longer
  # scenes: a model asked to write longer lines pads, and padding kills retention.
  # Retention-first Shorts: hook, concise middle, and a useful close.
  min_scenes: 9
  max_scenes: 9
  beats_max_scenes: 9
  words_per_scene: [7, 12]
  target_seconds: 36
  min_seconds: 30
  words_per_second: 2.9   # measured for en-US-AndrewNeural at rate +0%
  attempts: 2

# ---- voice ----------------------------------------------------------------------
# engine: edge  -> fastest to working, no key. Microsoft voices; not clearly
#                  licensed for commercial reuse. Fine for testing.
# engine: kokoro -> Apache-2.0 local model, clean rights. Requires `pip install kokoro soundfile`.
voice:
  # piper: local CPU, MIT-licensed, offline, no rate limit. Chosen because
  # edge-tts is throttled hard from cloud IPs (GitHub runners fail after ~5
  # scenes) and has no clear commercial licence.
  # edge: better sounding, but unreliable unattended and licence unclear.
  engine: kokoro
  piper_model: assets/piper/en_US-ryan-high.onnx
  name: en-US-AndrewNeural    # the five-minute-rule voice
  rate: "+0%"              # +8% shaved ~8% off duration; natural pace clears 30s
  pitch: "+0Hz"
  kokoro_voice: af_heart

# ---- captions -------------------------------------------------------------------
captions:
  enabled: true
  # auto -> ASS karaoke if this ffmpeg has libass, else Pillow PNG cards.
  # Homebrew's ffmpeg 8 has no libass, so `auto` resolves to png here.
  mode: auto
  font: Anton
  size: 88
  uppercase: true
  # Phrase cards, as used on the-five-minute-rule. "all" or "hook" re-enable
  # word-by-word highlighting, at ~2.5x the overlay count.
  per_word: false
  accent_hook: true
  max_words_per_line: 3
  max_chars_per_line: 20
  primary: "&H004DD8FF"     # ASS &HAABBGGRR - spoken word colour (warm yellow)
  secondary: "&H00FFFFFF"   # unspoken word colour
  outline: "&H00101010"
  outline_width: 7
  y: 1230                   # vertical centre of the caption block, of 1920
  slide_px: 22              # cards rise this many px on entry (0 disables)
  slide_s: 0.18

# ---- visuals --------------------------------------------------------------------
visuals:
  # AI-generated visuals only: local SDXL Turbo weights, no image search or stock picker.
  # Generation runs locally on Apple Silicon (MPS) or CPU; first run downloads model weights.
  provider: ai_cartoon
  require_ai_images: true       # applies when provider=ai_cartoon
  animate: true            # slow zoom/pan on stills; a slideshow is not a reel

  # Appended to every scene prompt. Keep a consistent cinematic-realism look.
  style_prompt: >-
    cinematic photorealism, emotionally expressive natural human subjects,
    dramatic practical lighting, rich but natural warm color grading,
    atmospheric depth, carefully composed vertical 9:16 film still,
    realistic environments and textures, one clear focal subject,
    no text, no words, no letters, no watermark, no logos

  # Local-only inference. No hosted image API, API key, quota, or image picker.
  ai_backend: local_sd
  remote_fallbacks: false
  local_model: stabilityai/sdxl-turbo
  local_steps: 2           # turbo checkpoints: guidance 0.0, 1-4 steps
  ai_model: sana
  # Conservative working size for 16 GB Apple Silicon; both axes must be /8.
  ai_width: 512
  ai_height: 768
  ai_retries: 4
  ai_backoff: 5
  ai_timeout: 120

  pexels_orientation: portrait
  # Only used by the procedural fallback. Warm charcoal rather than navy, so a
  # degraded scene at least stays in the channel's palette (white captions need
  # a dark ground to read against).
  palette:
    - "#1a1512"
    - "#2e2318"
    - "#241c16"
    - "#1f1814"
    - "#332619"
  fps: 30
  width: 1080
  height: 1920
  crf: 20
  preset: ultrafast        # per-scene b-roll; speed matters, quality does not
  grain: false             # temporal noise costs ~3x encode time; off by default
  # Refuse to build if more than this many scenes fall back to gradients. One
  # degraded scene among twelve is tolerable; thirteen is a different channel.
  max_procedural: 1
  zoom_rate: 0.0016
  zoom_max: 1.28
  final_preset: veryfast   # the one encode that ships
  final_crf: 19

# ---- audio ----------------------------------------------------------------------
audio:
  sample_rate: 48000
  music_dir: assets/music
  music_volume: 0.22
  target_lufs: -16
  duck: true
  tail_pad: 0.30            # seconds of silence after each scene's last word

# ---- output ---------------------------------------------------------------------
paths:
  work: work
  out: out
  db: work/reelforge.db

# ---- publish --------------------------------------------------------------------
publish:
  youtube:
    enabled: true
    privacy: public          # public | unlisted | private
    category_id: "27"        # 27 = Education, 28 = Science & Tech
    made_for_kids: false
  instagram:
    # Off until IG_USER_ID / IG_ACCESS_TOKEN exist in CI. Otherwise every daily
    # run attempts it, fails, and marks the run red even though YouTube posted.
    enabled: false
    share_to_feed: true
    host: none               # none | r2 | gh_release
  facebook:
    enabled: false
    video_state: PUBLISHED   # PUBLISHED | DRAFT
