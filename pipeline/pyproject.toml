[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reelforge"
version = "0.1.0"
description = "Faceless short-form video factory: script, voice, captions, render, publish."
requires-python = ">=3.10"
dependencies = [
  "edge-tts>=6.1.9",
  "requests>=2.31",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "Pillow>=10.0",
  "google-api-python-client>=2.100",
  "google-auth-oauthlib>=1.1",
  "google-auth-httplib2>=0.1.1",
  "boto3>=1.34",
]

[project.optional-dependencies]
kokoro = ["kokoro>=0.9", "soundfile>=0.12"]

[project.scripts]
reelforge = "reelforge.cli:main"


[tool.setuptools.packages.find]
where = ["src"]
